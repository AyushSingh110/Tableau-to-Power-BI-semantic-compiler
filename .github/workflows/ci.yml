name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r demo/backend/requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests run_pipeline.py eval demo/backend

      - name: Run tests (pytest)
        run: pytest -q

      - name: Run demo backend tests (pytest)
        run: pytest demo/backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/frontend/package-lock.json

      - name: Install & build frontend (typecheck + vite build)
        working-directory: demo/frontend
        run: |
          npm ci
          npm run build
